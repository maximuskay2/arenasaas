# Local infrastructure for Arena-SaaS development.
# Local DB/Redis for Arena-SaaS; forfeit + prize workers start with the stack by default.

services:
  postgres:
    image: postgres:16-alpine
    container_name: arena-postgres
    restart: unless-stopped
    ports:
      # Host 5435: 5432/5433/5434 often used by other local stacks on this machine
      - "5435:5432"
    environment:
      POSTGRES_USER: arena
      POSTGRES_PASSWORD: arena_dev
      POSTGRES_DB: arena_dev
    volumes:
      - arena_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arena -d arena_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: arena-redis
    restart: unless-stopped
    ports:
      # Host 6381: 6379 often used by other Redis instances
      - "6381:6379"
    command: redis-server --appendonly yes
    volumes:
      - arena_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Always-on forfeit poller (check-in SLA). Skip with: docker compose up -d postgres redis
  forfeit-worker:
    image: node:22-bookworm-slim
    container_name: arena-forfeit-worker
    restart: unless-stopped
    working_dir: /workspace/server
    volumes:
      - ./:/workspace
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://arena:arena_dev@postgres:5432/arena_dev
      DATABASE_RUNTIME_URL: postgresql://arena_app:arena_app_dev@postgres:5432/arena_dev
      FORFEIT_WORKER_POLL_MS: "15000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "cd /workspace/server && npm ci --omit=dev 2>/dev/null || npm install --omit=dev; npm run worker:forfeit"

  # Dedicated BullMQ prize worker (set PRIZE_PAYOUT_WORKER=0 on API if you use this exclusively).
  prize-payout-worker:
    image: node:22-bookworm-slim
    container_name: arena-prize-worker
    restart: unless-stopped
    working_dir: /workspace/server
    volumes:
      - ./:/workspace
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://arena:arena_dev@postgres:5432/arena_dev
      DATABASE_RUNTIME_URL: postgresql://arena_app:arena_app_dev@postgres:5432/arena_dev
      PRIZE_PAYOUT_WORKER: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "cd /workspace/server && npm ci --omit=dev 2>/dev/null || npm install --omit=dev; node -e \"import('./src/jobs/prizePayoutBullmq.js').then(m => m.startPrizePayoutBullWorker())\""

volumes:
  arena_pg_data:
  arena_redis_data:
