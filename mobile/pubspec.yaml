name: arena_mobile
description: Arena-SaaS multi-tenant esports client (player hub, discovery, matches).
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.3.3
  provider: ^6.1.2
  go_router: ^14.6.2
  url_launcher: ^6.3.1
  intl: ^0.19.0
  uuid: ^4.5.1
  # Real FCM — requires Firebase project (see docs/FIREBASE_SETUP.md)
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6
  # Match center / media / uploads
  socket_io_client: ^3.0.2
  webview_flutter: ^4.10.0
  image_picker: ^1.1.2
  http_parser: ^4.0.2
  collection: ^1.18.0
  app_links: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
